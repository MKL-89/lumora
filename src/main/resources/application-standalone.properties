# =============================================================================
#  STANDALONE profile - runs on any machine that has only Java.
#
#  No MySQL, no MariaDB, no XAMPP. The database is an embedded H2 file kept next
#  to the jar in ./lumora-data, running in MySQL-compatibility mode so the same
#  Flyway migrations and the same demo seed apply unchanged.
#
#  Activate with:  java -jar lumora.jar --spring.profiles.active=standalone,demo
# =============================================================================

# H2 file database in MySQL mode. The file persists between runs; delete the
# ./lumora-data folder to start from an empty school.
spring.datasource.url=jdbc:h2:file:./lumora-data/lumora;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Flyway owns the schema exactly as it does on MySQL; the migrations are written
# to parse under both engines.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=none

logging.level.com.lumora.sms=INFO
