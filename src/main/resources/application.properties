spring.application.name=lumora-school-management-system
server.port=${SERVER_PORT:8081}

# Profiles: "demo" seeds a fully populated school so every screen has real data.
# Override with APP_PROFILE=prod for a clean database with no sample records.
spring.profiles.active=${APP_PROFILE:demo}

# Create the database once in MySQL/MariaDB:
#   CREATE DATABASE lumora_db CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lumora_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Nairobi}
spring.datasource.username=${DB_USERNAME:lumora_user}
spring.datasource.password=${DB_PASSWORD:lumora_dev_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway owns the schema. Hibernate maps onto it and never alters it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# The dialect is deliberately not set: Hibernate detects MySQL or MariaDB from the
# live connection, so the same build runs against either.
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.thymeleaf.cache=false

# Surface real messages on the error page instead of a blank white screen.
server.error.include-message=always
server.error.include-binding-errors=always

# Security defaults; use environment variables for production configuration.
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
app.security.remember-me.key=${REMEMBER_ME_KEY:replace-this-with-a-long-random-secret}
app.security.reset.base-url=${PASSWORD_RESET_BASE_URL:http://localhost:8081}
app.security.reset.expiry-minutes=${PASSWORD_RESET_EXPIRY_MINUTES:30}
app.security.lockout.max-attempts=${LOCKOUT_MAX_ATTEMPTS:5}
app.security.lockout.minutes=${LOCKOUT_MINUTES:15}

# Per-tab sessions. A JSESSIONID cookie belongs to the whole browser, so by default
# every tab shares one login. With this on, the session is tracked in the URL
# instead, and each tab holds an independent login - which is what lets several
# roles be demonstrated side by side.
# Turn this OFF for any real deployment: a session id in a URL can leak through
# history, bookmarks and Referer headers. See SessionTrackingConfig.
app.security.per-tab-sessions=${PER_TAB_SESSIONS:true}
app.security.max-sessions-per-user=${MAX_SESSIONS_PER_USER:10}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
# With no SMTP server reachable the reset link is written to the log instead of emailed.
app.security.reset.mail-enabled=${MAIL_ENABLED:false}

# ---- School photos -----------------------------------------------------------
# Logo and photos uploaded on Administration > School photos are stored here,
# next to the database. Until a school uploads its own, bundled defaults are used.
app.media.dir=${MEDIA_DIR:./lumora-data/media}
# The service itself refuses pictures over 5 MB with a friendly message; this
# outer limit only stops absurdly large requests.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
